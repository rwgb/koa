---
- name: Configure ollama-vm
  hosts: ollama_vms
  become: false  # already root

  tasks:

    # -------------------------------------------------------------------------
    # System hardening
    # -------------------------------------------------------------------------

    - name: hardening | disable password authentication in sshd
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
        validate: /usr/sbin/sshd -t -f %s
      notify: restart sshd
      tags: hardening

    - name: hardening | install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: hardening

    - name: hardening | configure fail2ban jail for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.conf
        content: |
          [sshd]
          enabled  = true
          port     = ssh
          filter   = sshd
          maxretry = 5
          bantime  = 3600
          findtime = 600
        mode: '0644'
      notify: restart fail2ban
      tags: hardening

    - name: hardening | install unattended-upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        cache_valid_time: 3600
      tags: hardening

    - name: hardening | configure unattended-upgrades (security only)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::MinimalSteps "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";
        mode: '0644'
      tags: hardening

    - name: hardening | enable automatic updates via 20auto-upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: '0644'
      tags: hardening

    - name: hardening | install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        cache_valid_time: 3600
      tags: hardening

    - name: hardening | ufw default deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny
      tags: hardening

    - name: hardening | ufw default allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow
      tags: hardening

    - name: hardening | ufw allow SSH
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp
      tags: hardening

    - name: hardening | ufw allow Ollama API port 11434 from LAN only
      community.general.ufw:
        rule: allow
        port: '11434'
        proto: tcp
        src: 192.168.1.0/24
      tags: hardening

    - name: hardening | enable ufw
      community.general.ufw:
        state: enabled
      tags: hardening

    # -------------------------------------------------------------------------
    # Ollama service
    # -------------------------------------------------------------------------

    - name: ollama | ensure systemd override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/ollama.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: ollama

    - name: ollama | write systemd override to bind on all interfaces
      ansible.builtin.copy:
        dest: /etc/systemd/system/ollama.service.d/override.conf
        content: |
          [Service]
          Environment="OLLAMA_HOST=0.0.0.0:11434"
        mode: '0644'
      notify:
        - reload systemd
        - restart ollama
      tags: ollama

    - name: ollama | ensure ollama service is enabled and started
      ansible.builtin.systemd:
        name: ollama
        enabled: true
        state: started
        daemon_reload: true
      tags: ollama

    # -------------------------------------------------------------------------
    # Model management
    # -------------------------------------------------------------------------

    - name: models | pull qwen2.5:7b
      ansible.builtin.shell:
        cmd: ollama pull qwen2.5:7b
      changed_when: false
      tags: models

    # -------------------------------------------------------------------------
    # Log rotation
    # -------------------------------------------------------------------------

    - name: logrotate | configure ollama log rotation
      ansible.builtin.copy:
        dest: /etc/logrotate.d/ollama
        content: |
          /var/log/ollama/*.log {
              daily
              rotate 14
              compress
              delaycompress
              missingok
              notifempty
              create 0640 ollama ollama
              sharedscripts
              postrotate
                  systemctl kill --kill-who=main --signal=USR1 ollama.service 2>/dev/null || true
              endscript
          }
        mode: '0644'
      tags: logrotate

  # ---------------------------------------------------------------------------
  # Handlers
  # ---------------------------------------------------------------------------

  handlers:

    - name: restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart ollama
      ansible.builtin.service:
        name: ollama
        state: restarted
