- name: "sysctl | kernel.dmesg_restrict = 1 (may no-op in unprivileged containers)"
  ansible.posix.sysctl:
    name: kernel.dmesg_restrict
    value: '1'
    state: present
    reload: yes
    sysctl_set: yes
  ignore_errors: true
  tags: hardening
