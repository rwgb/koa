---
# Network namespace-aware sysctl hardening for LXC containers.
# These settings apply within the container's network namespace and are safe
# in both privileged and unprivileged LXC containers.
# Exception: kernel.* entries (e.g. kernel.dmesg_restrict) are host-kernel
# settings — they may silently no-op in unprivileged containers but will not
# cause the task to fail.

- name: "sysctl | net.ipv4.ip_forward = 0"
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '0'
    state: present
    reload: yes
    sysctl_set: yes
  tags: hardening

- name: "sysctl | net.ipv4.tcp_syncookies = 1"
  ansible.posix.sysctl:
    name: net.ipv4.tcp_syncookies
    value: '1'
    state: present
    reload: yes
    sysctl_set: yes
  tags: hardening

