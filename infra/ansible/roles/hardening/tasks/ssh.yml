---
- name: "SSH | PasswordAuthentication no"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening

- name: "SSH | PermitRootLogin prohibit-password"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening

- name: "SSH | X11Forwarding no"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?X11Forwarding'
    line: 'X11Forwarding no'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening

- name: "SSH | MaxAuthTries 3"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries'
    line: 'MaxAuthTries 3'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening

- name: "SSH | LoginGraceTime 30"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?LoginGraceTime'
    line: 'LoginGraceTime 30'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening

- name: "SSH | ClientAliveInterval 300"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ClientAliveInterval'
    line: 'ClientAliveInterval 300'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening

- name: "SSH | ClientAliveCountMax 2"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ClientAliveCountMax'
    line: 'ClientAliveCountMax 2'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening

- name: "SSH | AllowAgentForwarding no"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowAgentForwarding'
    line: 'AllowAgentForwarding no'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening

- name: "SSH | AllowUsers (restrict to hardening_ssh_allowed_users)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowUsers'
    line: "AllowUsers {{ hardening_ssh_allowed_users | join(' ') }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  when: hardening_ssh_allowed_users | default([]) | length > 0
  tags: hardening

- name: "SSH | Ciphers (AES-256 + ChaCha20 only)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Ciphers'
    line: 'Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening

- name: "SSH | MACs (ETM only)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MACs'
    line: 'MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening

- name: "SSH | KexAlgorithms (modern curves + large DH groups)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?KexAlgorithms'
    line: 'KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512'
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd
  tags: hardening
