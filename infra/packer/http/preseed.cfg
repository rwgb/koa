# Debian 12 preseed for Packer builds
# Fully automated install; root-only; no interactive prompts.

d-i partman/early_command \
       string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"

d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string ollama
d-i netcfg/get_domain string local

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Root account with temporary build password; key injection + password auth
# disabled happens in the shell provisioner after first boot.
d-i passwd/root-login boolean true
d-i passwd/root-password password packer-build
d-i passwd/root-password-again password packer-build
d-i passwd/make-user boolean false

# Disk partitioning — single ext4 root, no swap
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select single-root-no-swap
d-i partman-auto/expert_recipe string                     \
      single-root-no-swap ::                              \
              1000 50 -1 ext4                             \
                      filesystem{ ext4 }                  \
                      method{ format } format{ }          \
                      use_filesystem{ }                   \
                      mountpoint{ / }                     \
              .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Base packages (no desktop environment)
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server qemu-guest-agent curl ca-certificates acpid acpi-support dbus python3
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Allow root SSH login during the Packer build (key replaces password afterward)
# Also explicitly enable qemu-guest-agent so Proxmox can report the VM IP to Packer
d-i preseed/late_command string \
  sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /target/etc/ssh/sshd_config ; \
  in-target systemctl enable qemu-guest-agent

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note
