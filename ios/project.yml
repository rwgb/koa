name: Koa

options:
  bundleIdPrefix: com.brynard
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

targets:

  Koa:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Koa
    info:
      path: Koa/Info.plist
      properties:
        CFBundleDisplayName: Koa
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.3.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Allow HTTP to Tailscale .ts.net domains and localhost only
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brynard.koa
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Koa/Koa.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.io.koa.shared
        com.apple.developer.siri: true
    dependencies:
      - target: KoaWatch
        embed: true

  KoaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: KoaWatch
    info:
      path: KoaWatch/Info.plist
      properties:
        CFBundleDisplayName: Koa
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.3.0"
        WKCompanionAppBundleIdentifier: com.brynard.koa
        WKApplication: true
        # Allow HTTP to Tailscale .ts.net domains and localhost only
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brynard.koa.watch
        SWIFT_VERSION: "5.9"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: KoaWatch/KoaWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.koa.shared
