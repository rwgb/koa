name: AI Code Review

# Runs on every PR targeting main (i.e. develop → main release PRs).
# - Posts a detailed review comment on the PR.
# - Sets an "ai-review" commit status (success | failure).
# - PASS = no CRITICAL/HIGH findings; merge must be done manually.
#
# Required repo secret: ANTHROPIC_API_KEY
# Required branch protection on main:
#   Required status checks: "ci / Lint, typecheck & test"  AND  "ai-review"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate inputs
        run: |
          echo "${{ github.event.pull_request.number || inputs.pr_number }}" \
            | grep -Eq '^[0-9]+$' || { echo "Invalid PR_NUMBER"; exit 1; }

      - name: Run AI review
        run: node scripts/ai-review.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:         ${{ github.event.pull_request.number || inputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Use the PR head SHA, not the merge-ref SHA, so the status shows on the PR
          GITHUB_SHA:        ${{ github.event.pull_request.head.sha || github.sha }}

