name: AI Code Review

# Runs on every PR targeting main (i.e. develop → main release PRs).
# - Posts a detailed review comment on the PR.
# - Sets an "ai-review" commit status (success | failure).
# - Enables GitHub auto-merge (squash) when the review passes.
#   GitHub will then merge automatically once the "ci / test" check also passes.
#
# Required repo secret: ANTHROPIC_API_KEY
# Required repo setting: Settings → General → Allow auto-merge  ✓
# Required branch protection on main:
#   Required status checks: "ci / Lint, typecheck & test"  AND  "ai-review"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run AI review
        run: node scripts/ai-review.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:         ${{ github.event.pull_request.number || inputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Use the PR head SHA, not the merge-ref SHA, so the status shows on the PR
          GITHUB_SHA:        ${{ github.event.pull_request.head.sha || github.sha }}

      # Enable auto-merge only when the review passes (step above exits 0).
      # GitHub will wait for all other required status checks before merging.
      - name: Enable auto-merge (squash)
        if: success() && github.event_name == 'pull_request'
        run: gh pr merge --auto --squash "$PR_NUMBER" || true
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
