name: AI Code Review

# Runs on every PR targeting main (i.e. develop → main release PRs).
# - Posts a detailed review comment on the PR.
# - Sets an "ai-review" commit status (success | failure).
# - PASS = no CRITICAL/HIGH findings; merge must be done manually.
#
# Required repo secret: ANTHROPIC_API_KEY
# Required branch protection on main:
#   Required status checks: "ci / Lint, typecheck & test"  AND  "ai-review"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate inputs
        run: |
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ]; then PR="${{ inputs.pr_number }}"; fi
          echo "$PR" | grep -Eq '^[0-9]+$' || { echo "Invalid PR_NUMBER: $PR"; exit 1; }
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "Invalid SHA: $SHA"; exit 1; }
          # Write validated values into env for subsequent steps
          echo "SAFE_PR_NUMBER=$PR"  >> "$GITHUB_ENV"
          echo "SAFE_GITHUB_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Run AI review
        run: node scripts/ai-review.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:         ${{ env.SAFE_PR_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA:        ${{ env.SAFE_GITHUB_SHA }}

